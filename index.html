<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중등 기본서 + RPM 통합 학습 계산기</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;padding:24px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
.day-box{max-height:160px;overflow:auto;text-align:left}
.section-basic{color:#1565c0;font-weight:bold}
.section-rpm{color:#6a1b9a;font-weight:bold}
</style>
</head>

<body>

<h1>기본서 + RPM 통합 계산기</h1>

<input type="file" id="basicFile">
<input type="file" id="rpmFile">
<button onclick="handleFiles()">파일 읽기</button>
<button onclick="downloadCSV()">다운로드</button>

<table id="schedule"></table>

<script>

let summaryData=[];
let state={};

const basicCols=['필수 예제','확인 체크','발전 예제'];
const rpmCols=['대표 문제','유형 문제'];

const keys=[
'basic_concept',
...basicCols.map(c=>'basic_'+c),
...rpmCols.map(c=>'rpm_'+c)
];

const days=['d1','d2','d3'];

function count(row,k){
return row[k+'_count']||0;
}

function dayProblemCount(row,day){
let total=0;
Object.entries(state[row.pair_id]||{}).forEach(([k,d])=>{
if(d===day && k!=='basic_concept'){
total+=count(row,k);
}
});
return total;
}

function dayBasicTime(row,day){
let t=0;
Object.entries(state[row.pair_id]||{}).forEach(([k,d])=>{
if(d===day && k.startsWith('basic_')) t+=row[k]||0;
});
return t;
}

function dayRpmTime(row,day){
let t=0;
Object.entries(state[row.pair_id]||{}).forEach(([k,d])=>{
if(d===day && k.startsWith('rpm_')) t+=row[k]||0;
});
return t;
}

function dayTime(row,day){
return dayBasicTime(row,day)+dayRpmTime(row,day);
}

function dayBasicText(row,day){
return Object.entries(state[row.pair_id]||{})
.filter(([k,d])=>d===day && k.startsWith('basic_'))
.map(([k])=>k.replace('basic_',''))
.join('/');
}

function dayRpmText(row,day){
return Object.entries(state[row.pair_id]||{})
.filter(([k,d])=>d===day && k.startsWith('rpm_'))
.map(([k])=>k.replace('rpm_',''))
.join('/');
}

function downloadCSV(){

const rows=[[
'소단원','type',
'd1문항','d2문항','d3문항',
'd1시간','d2시간','d3시간',
'd1내용','d2내용','d3내용'
]];

summaryData.forEach(row=>{

rows.push([
row.basic_unit,
'day2',

dayProblemCount(row,'d1'),
dayProblemCount(row,'d2'),
dayProblemCount(row,'d3'),

dayTime(row,'d1'),
dayTime(row,'d2'),
dayTime(row,'d3'),

dayBasicText(row,'d1')+'|'+dayRpmText(row,'d1'),
dayBasicText(row,'d2')+'|'+dayRpmText(row,'d2'),
dayBasicText(row,'d3')+'|'+dayRpmText(row,'d3')
]);

});

const csv=rows.map(r=>r.join(',')).join('\n');

const blob=new Blob([csv]);
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='schedule.csv';
a.click();

}

</script>

</body>
</html>
