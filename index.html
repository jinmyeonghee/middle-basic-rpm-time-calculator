<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>중등 기본서 + RPM 통합 학습 스케줄러</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; background:#f7f7f7; }
    h1, h2, h3 { margin-bottom: 10px; }
    .box { background:#fff; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    label { display:block; margin:8px 0; }
    input[type="file"], input[type="number"] { padding:8px; width:100%; box-sizing:border-box; margin-bottom:10px; }
    button { padding:12px 20px; background:#111; color:#fff; border:0; border-radius:8px; cursor:pointer; font-weight:bold; }
    table { width:100%; border-collapse:collapse; background:#fff; margin-top:20px; }
    th, td { border:1px solid #ddd; padding:10px; vertical-align:top; }
    th { background:#eee; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .small { font-size:13px; color:#666; }
    .over { color:#d35400; font-weight:bold; }
    .ok { color:#148f4f; font-weight:bold; }
  </style>
</head>
<body>

<h1>중등 기본서 + RPM 통합 학습 스케줄러</h1>

<div class="box">
  <h2>파일 업로드</h2>
  <label>기본서 엑셀 파일</label>
  <input type="file" id="basicFile" accept=".xlsx,.xls" />

  <label>RPM 엑셀 파일</label>
  <input type="file" id="rpmFile" accept=".xlsx,.xls" />

  <label>하루 목표 학습 시간(분)</label>
  <input type="number" id="dailyLimit" value="120" />

  <label>주당 개인학습일</label>
  <input type="number" id="daysPerWeek" value="4" />

  <label>문항 1개당 풀이 시간(분)</label>
  <input type="number" id="problemMin" value="2" />
</div>

<div class="grid">
  <div class="box">
    <h2>기본서 Day1 학습</h2>
    <p class="small">1회독 첫날에 반드시 할 기본서 학습 항목</p>
    <div id="basicDay1Checks"></div>
  </div>

  <div class="box">
    <h2>기본서 Day2~Day4 학습</h2>
    <p class="small">Day1 이후로 넘길 기본서 학습 항목</p>
    <div id="basicLaterChecks"></div>
  </div>
</div>

<div class="grid">
  <div class="box">
    <h2>RPM Day1 학습</h2>
    <p class="small">기본서 진도와 함께 바로 붙일 RPM 학습 항목</p>
    <div id="rpmDay1Checks"></div>
  </div>

  <div class="box">
    <h2>RPM Day2~Day4 학습</h2>
    <p class="small">Day1 이후로 넘길 RPM 학습 항목</p>
    <div id="rpmLaterChecks"></div>
  </div>
</div>

<div class="box">
  <button onclick="makeSchedule()">시간표 생성</button>
</div>

<div class="box">
  <h2>결과</h2>
  <div id="summary"></div>
  <div id="result"></div>
</div>

<script>
const BASIC_COLUMNS = [
  "개념영상",
  "개념원리 익히기",
  "필수예제",
  "확인체크",
  "발전예제",
  "발전확인",
  "특강예제",
  "특강확인",
  "STEP1",
  "STEP2",
  "실력UP"
];

const RPM_COLUMNS = [
  "대표문제 영상",
  "교과서 문제",
  "대표 문제",
  "유형 문제",
  "유형UP 대표 문제",
  "유형UP 유형 문제",
  "시꼭문",
  "시꼭문 서술형",
  "시꼭문 실력UP"
];

function renderChecks(targetId, columns, checkedList = []) {
  const el = document.getElementById(targetId);
  el.innerHTML = columns.map(col => `
    <label>
      <input type="checkbox" value="${col}" ${checkedList.includes(col) ? "checked" : ""}>
      ${col}
    </label>
  `).join("");
}

renderChecks("basicDay1Checks", BASIC_COLUMNS, [
  "개념영상",
  "개념원리 익히기",
  "필수예제"
]);

renderChecks("basicLaterChecks", BASIC_COLUMNS, [
  "확인체크",
  "발전예제",
  "발전확인",
  "특강예제",
  "특강확인",
  "STEP1",
  "STEP2",
  "실력UP"
]);

renderChecks("rpmDay1Checks", RPM_COLUMNS, [
  "대표문제 영상",
  "대표 문제",
  "유형UP 대표 문제"
]);

renderChecks("rpmLaterChecks", RPM_COLUMNS, [
  "교과서 문제",
  "유형 문제",
  "유형UP 유형 문제",
  "시꼭문",
  "시꼭문 서술형",
  "시꼭문 실력UP"
]);

function getChecked(id) {
  return [...document.querySelectorAll(`#${id} input:checked`)].map(x => x.value);
}

function num(v) {
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}

function msToMin(ms) {
  return num(ms) / 1000 / 60;
}

function fmt(min) {
  const m = Math.round(min);
  const h = Math.floor(m / 60);
  const r = m % 60;
  if (h === 0) return `${r}분`;
  if (r === 0) return `${h}시간`;
  return `${h}시간 ${r}분`;
}

function readWorkbook(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const data = new Uint8Array(e.target.result);
      resolve(XLSX.read(data, { type: "array" }));
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function workbookToRows(wb) {
  let rows = [];
  wb.SheetNames.forEach(sheetName => {
    const sheet = wb.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    json.forEach(row => rows.push({ ...row, sheetName }));
  });
  return rows;
}

function getUnitId(row) {
  return row.unit_id || row.소단원id || row.custom_code || "";
}

function calcBasicRows(rows, day1Cols, laterCols, problemMin) {
  const map = {};

  rows.forEach(row => {
    const unit = getUnitId(row);
    if (!unit) return;

    if (!map[unit]) {
      map[unit] = {
        unit_id: unit,
        sheetName: row.sheetName,
        day1Time: 0,
        laterTime: 0,
        day1Items: [],
        laterItems: []
      };
    }

    const videoMin = msToMin(row.duration_ms);

    day1Cols.forEach(col => {
      if (col === "개념영상") {
        if (videoMin > 0) {
          map[unit].day1Time += videoMin;
          map[unit].day1Items.push(`개념영상 ${fmt(videoMin)}`);
        }
      } else if (row[col] !== undefined && row[col] !== "") {
        const count = num(row[col]);
        if (count > 0) {
          const t = count * problemMin;
          map[unit].day1Time += t;
          map[unit].day1Items.push(`${col} ${count}문항`);
        }
      }
    });

    laterCols.forEach(col => {
      if (col === "개념영상") {
        if (videoMin > 0) {
          map[unit].laterTime += videoMin;
          map[unit].laterItems.push(`개념영상 ${fmt(videoMin)}`);
        }
      } else if (row[col] !== undefined && row[col] !== "") {
        const count = num(row[col]);
        if (count > 0) {
          const t = count * problemMin;
          map[unit].laterTime += t;
          map[unit].laterItems.push(`${col} ${count}문항`);
        }
      }
    });
  });

  return map;
}

function calcRpmRows(rows, day1Cols, laterCols, problemMin) {
  const map = {};

  rows.forEach(row => {
    const unit = getUnitId(row);
    if (!unit) return;

    if (!map[unit]) {
      map[unit] = {
        unit_id: unit,
        sheetName: row.sheetName,
        day1Time: 0,
        laterTime: 0,
        day1Items: [],
        laterItems: []
      };
    }

    const videoType = String(row.video_type || "").trim();
    const videoMin = msToMin(row.duration_ms);

    day1Cols.forEach(col => {
      if (col === "대표문제 영상") {
        if (videoType === "2" && videoMin > 0) {
          map[unit].day1Time += videoMin;
          map[unit].day1Items.push(`대표문제 영상 ${fmt(videoMin)}`);
        }
      } else if (row[col] !== undefined && row[col] !== "") {
        const count = num(row[col]);
        if (count > 0) {
          const t = count * problemMin;
          map[unit].day1Time += t;
          map[unit].day1Items.push(`${col} ${count}문항`);
        }
      }
    });

    laterCols.forEach(col => {
      if (col === "대표문제 영상") {
        if (videoType === "2" && videoMin > 0) {
          map[unit].laterTime += videoMin;
          map[unit].laterItems.push(`대표문제 영상 ${fmt(videoMin)}`);
        }
      } else if (row[col] !== undefined && row[col] !== "") {
        const count = num(row[col]);
        if (count > 0) {
          const t = count * problemMin;
          map[unit].laterTime += t;
          map[unit].laterItems.push(`${col} ${count}문항`);
        }
      }
    });
  });

  return map;
}

function mergeTasks(basicMap, rpmMap) {
  const ids = [...new Set([...Object.keys(basicMap), ...Object.keys(rpmMap)])];

  let tasks = [];

  ids.forEach(id => {
    const b = basicMap[id];
    const r = rpmMap[id];

    const day1Time = (b?.day1Time || 0) + (r?.day1Time || 0);
    const laterTime = (b?.laterTime || 0) + (r?.laterTime || 0);

    if (day1Time > 0) {
      tasks.push({
        unit_id: id,
        phase: "Day1 학습",
        time: day1Time,
        basic: b?.day1Items || [],
        rpm: r?.day1Items || []
      });
    }

    if (laterTime > 0) {
      tasks.push({
        unit_id: id,
        phase: "Day2~Day4 학습",
        time: laterTime,
        basic: b?.laterItems || [],
        rpm: r?.laterItems || []
      });
    }
  });

  return tasks;
}

function buildSchedule(tasks, dailyLimit) {
  const days = [];
  let day = {
    dayNo: 1,
    total: 0,
    tasks: []
  };

  tasks.forEach(task => {
    if (day.tasks.length > 0 && day.total + task.time > dailyLimit) {
      days.push(day);
      day = {
        dayNo: days.length + 1,
        total: 0,
        tasks: []
      };
    }

    day.tasks.push(task);
    day.total += task.time;
  });

  if (day.tasks.length > 0) days.push(day);
  return days;
}

async function makeSchedule() {
  const basicFile = document.getElementById("basicFile").files[0];
  const rpmFile = document.getElementById("rpmFile").files[0];

  if (!basicFile || !rpmFile) {
    alert("기본서 파일과 RPM 파일을 모두 업로드해주세요.");
    return;
  }

  const dailyLimit = num(document.getElementById("dailyLimit").value);
  const daysPerWeek = num(document.getElementById("daysPerWeek").value);
  const problemMin = num(document.getElementById("problemMin").value);

  const basicDay1Cols = getChecked("basicDay1Checks");
  const basicLaterCols = getChecked("basicLaterChecks");
  const rpmDay1Cols = getChecked("rpmDay1Checks");
  const rpmLaterCols = getChecked("rpmLaterChecks");

  const basicWb = await readWorkbook(basicFile);
  const rpmWb = await readWorkbook(rpmFile);

  const basicRows = workbookToRows(basicWb);
  const rpmRows = workbookToRows(rpmWb);

  const basicMap = calcBasicRows(basicRows, basicDay1Cols, basicLaterCols, problemMin);
  const rpmMap = calcRpmRows(rpmRows, rpmDay1Cols, rpmLaterCols, problemMin);

  const tasks = mergeTasks(basicMap, rpmMap);
  const days = buildSchedule(tasks, dailyLimit);

  const totalMin = days.reduce((sum, d) => sum + d.total, 0);
  const weeks = Math.ceil(days.length / daysPerWeek);

  document.getElementById("summary").innerHTML = `
    <p><b>총 학습일:</b> ${days.length}일</p>
    <p><b>예상 소요 주차:</b> ${weeks}주</p>
    <p><b>총 학습 시간:</b> ${fmt(totalMin)}</p>
  `;

  let html = `
    <table>
      <thead>
        <tr>
          <th>주차</th>
          <th>Day</th>
          <th>소단원</th>
          <th>학습 구분</th>
          <th>기본서 학습</th>
          <th>RPM 학습</th>
          <th>예상 시간</th>
        </tr>
      </thead>
      <tbody>
  `;

  days.forEach((d, i) => {
    const week = Math.ceil((i + 1) / daysPerWeek);
    d.tasks.forEach((task, idx) => {
      html += `
        <tr>
          <td>${idx === 0 ? week + "주차" : ""}</td>
          <td>${idx === 0 ? "Day " + (i + 1) : ""}</td>
          <td>${task.unit_id}</td>
          <td>${task.phase}</td>
          <td>${task.basic.length ? task.basic.join("<br>") : "-"}</td>
          <td>${task.rpm.length ? task.rpm.join("<br>") : "-"}</td>
          <td>${fmt(task.time)}</td>
        </tr>
      `;
    });

    html += `
      <tr>
        <td colspan="6" style="text-align:right;"><b>Day ${i + 1} 총 시간</b></td>
        <td class="${d.total > dailyLimit ? "over" : "ok"}">${fmt(d.total)}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
