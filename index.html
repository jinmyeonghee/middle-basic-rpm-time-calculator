<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중등 기본서 + RPM 통합 학습 시간 계산기</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;padding:24px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#f5f5f5}
.day-box{max-height:180px;overflow:auto;text-align:left}
.section-basic{color:#1565c0;font-weight:bold}
.section-rpm{color:#6a1b9a;font-weight:bold}
.time-ok{background:#e8f5e9}
.time-over{background:#ffebee}
</style>
</head>

<body>

<h1>중등 기본서 + RPM 통합 학습 (Day1~3)</h1>

<input type="file" id="basicFile">
<input type="file" id="rpmFile">
<button onclick="loadFiles()">불러오기</button>

<table id="schedule"></table>

<script>

let data=[];

function loadFiles(){
  const bf=document.getElementById("basicFile").files[0];
  const rf=document.getElementById("rpmFile").files[0];

  Promise.all([readExcel(bf), readExcel(rf)]).then(([b,r])=>{
    buildData(b,r);
    render();
  });
}

function readExcel(file){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws));
    };
    reader.readAsArrayBuffer(file);
  });
}

function buildData(basic, rpm){
  const bUnits=[...new Set(basic.map(r=>r.unit_id))];
  const rUnits=[...new Set(rpm.map(r=>r.unit_id))];

  data=bUnits.map((b,i)=>{
    return {
      basic:b,
      rpm:rUnits[i] || "-"
    };
  });
}

function render(){
  let html=`
  <tr>
    <th rowspan="2">소단원</th>
    <th colspan="5">Day1</th>
    <th colspan="5">Day2</th>
    <th colspan="5">Day3</th>
  </tr>
  <tr>
    <th>기본서</th><th>기본서 시간</th>
    <th>RPM</th><th>RPM 시간</th>
    <th>총시간</th>

    <th>기본서</th><th>기본서 시간</th>
    <th>RPM</th><th>RPM 시간</th>
    <th>총시간</th>

    <th>기본서</th><th>기본서 시간</th>
    <th>RPM</th><th>RPM 시간</th>
    <th>총시간</th>
  </tr>`;

  data.forEach(d=>{
    html+=`
    <tr>
      <td>${d.basic}, ${d.rpm}</td>

      ${dayCell()} ${dayCell()} ${dayCell()}
    </tr>`;
  });

  document.getElementById("schedule").innerHTML=html;
}

function dayCell(){
  return `
  <td class="day-box">기본서 항목</td>
  <td>60</td>
  <td class="day-box">RPM 항목</td>
  <td>60</td>
  <td>120</td>
  `;
}

</script>

</body>
</html>
