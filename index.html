<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중등 기본서 + RPM 통합 학습 시간 계산기</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Arial,sans-serif;padding:24px;background:#fff}
button,select,input{padding:6px 10px;margin:4px}
table{border-collapse:collapse;width:100%;margin-top:16px;font-size:14px}
th,td{border:1px solid #ccc;padding:6px;text-align:center;vertical-align:top}
th{background:#f5f5f5}
.sticky-summary{background:#fff8dc;border:1px solid #ddd;padding:12px;margin-bottom:20px}
.control-box{margin:14px 0;padding:12px;border:1px solid #ddd;background:#fafafa}
.day-box{width:220px;max-height:190px;overflow-y:auto;text-align:left;margin:0 auto}
.day-box label{display:block;font-size:14px}
.section-basic{color:#1565c0;font-weight:bold}
.section-rpm{color:#6a1b9a;font-weight:bold}
.time-ok{background:#e8f5e9}
.time-over{background:#ffebee;color:red;font-weight:bold}
</style>
</head>

<body>

<h1>중등 기본서 + RPM 통합 학습 시간 계산기 Day3 시간분리</h1>

<div class="sticky-summary">
기본서 파일과 RPM 파일을 업로드하면 요약이 표시됩니다.
</div>

<h2>1. 데이터 입력</h2>

<div class="control-box">
  <b>기본서 파일</b><br>
  <input type="file" id="basicFile"><br><br>

  <b>RPM 파일</b><br>
  <input type="file" id="rpmFile"><br><br>

  <button onclick="loadFiles()">파일 읽기</button>
</div>

<h2>2. 소단원 집계 결과</h2>
<table id="summary"></table>

<h2>3. Day 스케줄</h2>

<div class="control-box">
  하루 기준 시간
  <select id="limit">
    <option value="60">60</option>
    <option value="90">90</option>
    <option value="120" selected>120</option>
  </select>

  <br><br>

  <button onclick="autoSplit()">통합 기본형 자동분배</button>
  <button onclick="autoLimit()">기준시간 맞춤형 자동분배</button>
</div>

<table id="schedule"></table>

<h2>4. 커리큘럼 요약</h2>

<script>

let data=[];

function loadFiles(){
  alert("여기까지 구현된 최종 UI 버전입니다.\n(엑셀 파싱 로직 붙이면 완성)");
}

/* ===== 핵심 UI 구조 ===== */

function render(){

let html=`
<tr>
<th rowspan="2">소단원</th>

<th colspan="5">Day1</th>
<th colspan="5">Day2</th>
<th colspan="5">Day3</th>
</tr>

<tr>
<th>기본서</th><th>기본서 시간</th>
<th>RPM</th><th>RPM 시간</th>
<th>총시간</th>

<th>기본서</th><th>기본서 시간</th>
<th>RPM</th><th>RPM 시간</th>
<th>총시간</th>

<th>기본서</th><th>기본서 시간</th>
<th>RPM</th><th>RPM 시간</th>
<th>총시간</th>
</tr>
`;

for(let i=1;i<=5;i++){
html+=`
<tr>
<td>${i}단원</td>

${day()}
${day()}
${day()}

</tr>
`;
}

document.getElementById("schedule").innerHTML=html;
}

function day(){
return `
<td class="day-box">기본서 체크</td>
<td>60</td>
<td class="day-box">RPM 체크</td>
<td>60</td>
<td>120</td>
`;
}

render();

</script>

</body>
</html>
